{% extends "base.html" %}
{% block title %}排班管理 - 效率看板{% endblock %}
{% block page_title %}排班管理{% endblock %}
{% block content %}
<style>
  /* 排班管理 - 浅色 KPI 卡片 */
  .schedule-kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 24px;
  }
  @media (max-width: 1100px) {
    .schedule-kpi-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .schedule-kpi-grid { grid-template-columns: 1fr; }
  }
  .schedule-kpi-card {
    border-radius: var(--radius);
    padding: 22px 24px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(0,0,0,0.04);
    position: relative;
    overflow: hidden;
    transition: transform .15s, box-shadow .15s;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .schedule-kpi-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }
  .schedule-kpi-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 5px;
  }
  .schedule-kpi-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .schedule-kpi-body { flex: 1; }
  .schedule-kpi-label {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    opacity: 0.85;
  }
  .schedule-kpi-value {
    font-size: 34px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 6px;
  }
  .schedule-kpi-sub {
    font-size: 12px;
    font-weight: 500;
    opacity: 0.75;
  }
  /* 四种浅色主题 */
  .skpi-blue  { background: linear-gradient(135deg, #eef7ff, #f5fbff); }
  .skpi-blue  .schedule-kpi-icon { background: #dbeafe; color: #2563eb; }
  .skpi-blue  .schedule-kpi-value { color: #1e40af; }
  .skpi-blue  .schedule-kpi-label { color: #3b82f6; }
  .skpi-blue  .schedule-kpi-sub   { color: #60a5fa; }
  .skpi-blue::before { background: #60a5fa; }

  .skpi-green { background: linear-gradient(135deg, #eefdf4, #f5fff8); }
  .skpi-green .schedule-kpi-icon { background: #dcfce7; color: #16a34a; }
  .skpi-green .schedule-kpi-value { color: #166534; }
  .skpi-green .schedule-kpi-label { color: #22c55e; }
  .skpi-green .schedule-kpi-sub   { color: #4ade80; }
  .skpi-green::before { background: #4ade80; }

  .skpi-orange { background: linear-gradient(135deg, #fff7ed, #fffbf5); }
  .skpi-orange .schedule-kpi-icon { background: #ffedd5; color: #ea580c; }
  .skpi-orange .schedule-kpi-value { color: #9a3412; }
  .skpi-orange .schedule-kpi-label { color: #f97316; }
  .skpi-orange .schedule-kpi-sub   { color: #fb923c; }
  .skpi-orange::before { background: #fb923c; }

  .skpi-purple { background: linear-gradient(135deg, #f9f5ff, #fdf7ff); }
  .skpi-purple .schedule-kpi-icon { background: #f3e8ff; color: #9333ea; }
  .skpi-purple .schedule-kpi-value { color: #6b21a8; }
  .skpi-purple .schedule-kpi-label { color: #a855f7; }
  .skpi-purple .schedule-kpi-sub   { color: #c084fc; }
  .skpi-purple::before { background: #c084fc; }
</style>

<div class="anim delay-1">
  <!-- KPI Cards -->
  <div class="schedule-kpi-grid" id="schedule-kpi">
    <div class="schedule-kpi-card skpi-blue">
      <div class="schedule-kpi-icon">📅</div>
      <div class="schedule-kpi-body">
        <div class="schedule-kpi-label">排班月份</div>
        <div class="schedule-kpi-value" id="kpi-month" style="font-size:26px">--</div>
        <div class="schedule-kpi-sub" id="kpi-today">--</div>
      </div>
    </div>
    <div class="schedule-kpi-card skpi-green">
      <div class="schedule-kpi-icon">👥</div>
      <div class="schedule-kpi-body">
        <div class="schedule-kpi-label">排班总人数</div>
        <div class="schedule-kpi-value" id="kpi-people">--</div>
        <div class="schedule-kpi-sub" id="kpi-groups">--</div>
      </div>
    </div>
    <div class="schedule-kpi-card skpi-orange">
      <div class="schedule-kpi-icon">✅</div>
      <div class="schedule-kpi-body">
        <div class="schedule-kpi-label">今日出勤人数</div>
        <div class="schedule-kpi-value" id="kpi-headcount">--</div>
        <div class="schedule-kpi-sub" id="kpi-headcount-sub">--</div>
      </div>
    </div>
    <div class="schedule-kpi-card skpi-purple">
      <div class="schedule-kpi-icon">🛌</div>
      <div class="schedule-kpi-body">
        <div class="schedule-kpi-label">今日休息 & 请假人数</div>
        <div class="schedule-kpi-value" id="kpi-rest-leave">--</div>
        <div class="schedule-kpi-sub" id="kpi-rest-leave-sub">--</div>
      </div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="card mb-24" style="padding:12px 20px">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
      <!-- Position filter chips -->
      <div id="position-filters" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      <!-- Right controls -->
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div style="display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden">
          <button class="view-btn active" data-mode="month" onclick="setViewMode('month')">月视图</button>
          <button class="view-btn" data-mode="week" onclick="setViewMode('week')">周视图</button>
          <button class="view-btn" data-mode="day" onclick="setViewMode('day')">天视图</button>
        </div>
        <div id="nav-controls" style="display:none;gap:4px;align-items:center">
          <button id="btn-prev" onclick="navigate(-1)" style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:14px">‹</button>
          <span id="nav-label" style="font-size:13px;font-weight:600;min-width:90px;text-align:center;color:var(--text1)">--</span>
          <button id="btn-next" onclick="navigate(1)" style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:14px">›</button>
          <button id="btn-today" onclick="goToday()" style="padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:12px;color:var(--accent)">今天</button>
        </div>
        <button id="btn-refresh" onclick="refreshSchedule()" style="padding:8px 20px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s">刷新数据</button>
      </div>
    </div>
  </div>

  <!-- Content area -->
  <div id="schedule-content"></div>

  <!-- Loading -->
  <div id="loading" style="text-align:center;padding:60px;color:var(--text2)">
    <div style="font-size:32px;margin-bottom:12px;opacity:.3">◴</div>
    <p>正在加载排班数据...</p>
  </div>
</div>

<script>
let scheduleData = null;
let viewMode = 'month';
let currentDay = 1;
let activePositions = new Set(); // empty = all

// 排班值 → 类型
const TYPE_MAP = {
  '苹果':'work-apple','1':'work','出勤':'work',
  '魔镜':'work-mirror','充电':'work-charge',
  'X-Ray':'work-xray','X光':'work-xray','分流':'work-divert',
  '休':'rest','休息':'rest',
  '加':'overtime','加班':'overtime',
  '请假':'leave',
  '支援':'support',
  '异常':'abnormal',
};

// 高对比度排班类型色（背景深、文字在渲染时自动配白/深色）
const TYPE_COLORS = {
  'work':'#16a34a','work-apple':'#2563eb','work-mirror':'#9333ea',
  'work-charge':'#0891b2','work-xray':'#d97706','work-divert':'#4f46e5',
  'rest':'#6b7280','overtime':'#ea580c','leave':'#dc2626',
  'support':'#3b82f6','abnormal':'#db2777',
};

// 根据背景亮度返回文字色（深底白字、浅底黑字）
function getContrastColor(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const yiq = (r*299 + g*587 + b*114) / 1000;
  return yiq >= 150 ? '#1f2937' : '#ffffff';
}

const TYPE_LABELS = {
  'work':'出勤','work-apple':'苹果','work-mirror':'魔镜',
  'work-charge':'充电','work-xray':'X光','work-divert':'分流',
  'rest':'休息','overtime':'加班','leave':'请假',
  'support':'支援','abnormal':'异常',
};

function getType(val) {
  if (!val) return '';
  return TYPE_MAP[val] || '';
}

function getTypeColor(val) {
  const t = getType(val);
  return t ? TYPE_COLORS[t] : '';
}

function getTypeLabel(val) {
  const t = getType(val);
  return t ? TYPE_LABELS[t] : '';
}

// 2026年8月每天是星期几
function getWeekday(day) {
  const weekdays = ['六','日','一','二','三','四','五'];
  return weekdays[(day - 1) % 7];
}

function getWeekdayNum(day) {
  const map = {'六':5,'日':6,'一':0,'二':1,'三':2,'四':3,'五':4};
  return map[getWeekday(day)] ?? 0;
}

function isWeekend(day) {
  const w = getWeekday(day);
  return w === '六' || w === '日';
}

function getWeekStart(day) {
  return Math.max(1, day - getWeekdayNum(day));
}

// ============ Position Filters ============
function renderPositionFilters() {
  const container = document.getElementById('position-filters');
  // Collect all unique position_tags with colors
  const posMap = new Map();
  scheduleData.groups.forEach(g => {
    g.members.forEach(m => {
      const tag = m.position_tag || g.name;
      if (!posMap.has(tag)) {
        posMap.set(tag, m.position_color || '#888');
      }
    });
  });

  let html = '<button class="pos-chip active" style="background:var(--accent);color:#fff;border:none" onclick="toggleAllPositions()">全部</button>';
  for (const [tag, color] of posMap) {
    html += `<button class="pos-chip" data-pos="${tag}" style="border:2px solid ${color};background:#fff;color:${color}" onclick="togglePosition('${tag}')">${tag}</button>`;
  }
  container.innerHTML = html;
}

function togglePosition(tag) {
  if (activePositions.has(tag)) {
    activePositions.delete(tag);
  } else {
    activePositions.add(tag);
  }
  updateFilterChips();
  renderContent();
}

function toggleAllPositions() {
  activePositions.clear();
  updateFilterChips();
  renderContent();
}

function updateFilterChips() {
  const chips = document.querySelectorAll('.pos-chip');
  chips.forEach(chip => {
    if (!chip.dataset.pos) {
      // "全部" button
      chip.classList.toggle('active', activePositions.size === 0);
      chip.style.background = activePositions.size === 0 ? 'var(--accent)' : '#fff';
      chip.style.color = activePositions.size === 0 ? '#fff' : 'var(--text2)';
    } else {
      const tag = chip.dataset.pos;
      const isActive = activePositions.size === 0 || activePositions.has(tag);
      chip.classList.toggle('active', isActive);
      chip.style.opacity = isActive ? '1' : '0.4';
    }
  });
}

function shouldShowMember(m, g) {
  if (activePositions.size === 0) return true;
  const tag = m.position_tag || g.name;
  return activePositions.has(tag);
}

// ============ KPI ============
function renderKPI(data) {
  document.getElementById('kpi-month').textContent = data.month;
  document.getElementById('kpi-today').textContent = `今天 ${data.today_day}日 ${data.today_weekday}`;
  document.getElementById('kpi-people').textContent = data.total_people;
  document.getElementById('kpi-groups').textContent = `${data.total_groups} 个组`;
  document.getElementById('kpi-headcount').textContent = data.today_headcount || '--';
  document.getElementById('kpi-headcount-sub').textContent = '合计出勤人数';
  const rl = data.today_rest_leave_count ?? (data.today_rest_count + data.today_leave_count);
  document.getElementById('kpi-rest-leave').textContent = rl || '0';
  document.getElementById('kpi-rest-leave-sub').textContent = `休息 ${data.today_rest_count || 0} 人 · 请假 ${data.today_leave_count || 0} 人`;
}

// ============ View Mode ============
function setViewMode(mode) {
  viewMode = mode;
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  document.getElementById('nav-controls').style.display = mode === 'month' ? 'none' : 'flex';
  if (mode !== 'month' && scheduleData) {
    currentDay = scheduleData.today_day || 1;
  }
  renderContent();
}

function navigate(dir) {
  if (viewMode === 'day') {
    currentDay = Math.max(1, Math.min(31, currentDay + dir));
  } else if (viewMode === 'week') {
    currentDay = Math.max(1, Math.min(31, currentDay + 7 * dir));
  }
  renderContent();
}

function goToday() {
  if (scheduleData) {
    currentDay = scheduleData.today_day || 1;
    renderContent();
  }
}

function updateNavLabel() {
  const label = document.getElementById('nav-label');
  if (viewMode === 'day') {
    label.textContent = `8月${currentDay}日 周${getWeekday(currentDay)}`;
  } else if (viewMode === 'week') {
    const ws = getWeekStart(currentDay);
    const we = Math.min(31, ws + 6);
    label.textContent = `8月${ws}-${we}日`;
  }
}

// ============ Avatar ============
function avatarHtml(name, color, size) {
  size = size || 36;
  const initial = name ? name.charAt(0) : '?';
  return `<span style="display:inline-flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;border-radius:50%;background:${color};color:#fff;font-size:${Math.round(size*0.4)}px;font-weight:700;flex-shrink:0">${initial}</span>`;
}

// ============ Month View (Heatmap Cards) ============
function renderMonthView() {
  const groups = scheduleData.groups;
  const todayDay = scheduleData.today_day;
  let html = '';

  groups.forEach(g => {
    const visibleMembers = g.members.filter(m => shouldShowMember(m, g));
    if (visibleMembers.length === 0) return;

    // Use the first member's position_color for the group header, or find the most common
    const groupColor = visibleMembers[0].position_color || '#888';
    const groupTag = visibleMembers[0].position_tag || g.name;

    html += `<div class="card mb-16" style="overflow:hidden">`;
    // Group header
    html += `<div style="display:flex;align-items:center;gap:10px;padding:12px 20px;background:${groupColor}15;border-left:4px solid ${groupColor}">`;
    html += `<span style="font-size:16px;font-weight:700;color:${groupColor}">${g.name}</span>`;
    html += `<span style="font-size:12px;color:var(--text2);background:${groupColor}10;padding:2px 10px;border-radius:12px">${groupTag}</span>`;
    html += `<span style="font-size:12px;color:var(--text2)">${visibleMembers.length}人</span>`;
    html += `</div>`;

    // Member rows
    html += `<div style="padding:8px 20px">`;
    visibleMembers.forEach(m => {
      const color = m.position_color || groupColor;
      const tag = m.position_tag || g.name;
      const stats = m.stats || {};
      const workDays = stats['出勤天数'] || '';
      const restDays = stats['休息天数'] || '';
      const otDays = stats['加班天数'] || '';

      html += `<div class="sched-row" style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #f0f0f0">`;
      // Avatar + name (narrower to leave room for days)
      html += `<div style="display:flex;align-items:center;gap:8px;min-width:110px;flex-shrink:0">`;
      html += avatarHtml(m.name, color, 32);
      html += `<div style="min-width:0;overflow:hidden">`;
      html += `<div style="font-size:13px;font-weight:600;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.name}</div>`;
      html += `<div style="font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.id || '--'} · ${tag}</div>`;
      html += `</div></div>`;

      // Day heatmap: each day flexes to fill width
      html += `<div style="display:flex;gap:2px;flex:1;min-width:0">`;
      m.days.forEach((val, di) => {
        const day = di + 1;
        const t = getType(val);
        const tc = t ? TYPE_COLORS[t] : '';
        const isToday = day === todayDay;
        const weekend = isWeekend(day);
        let bg = tc || (weekend ? '#f3f4f6' : '#f8f9fa');
        let border = isToday ? '2px solid var(--orange)' : '1px solid #e5e7eb';
        let color = tc ? getContrastColor(tc) : (weekend ? '#6b7280' : '#9ca3af');
        let title = `${day}日 周${getWeekday(day)}: ${val || '无排班'}`;
        html += `<div title="${title}" style="flex:1;min-width:14px;height:26px;background:${bg};border:${border};border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:${color};cursor:default;overflow:hidden;white-space:nowrap">${val || ''}</div>`;
      });
      html += `</div>`;

      // Stats badges
      html += `<div style="display:flex;gap:6px;flex-shrink:0;min-width:90px;justify-content:flex-end">`;
      if (workDays) html += `<span style="font-size:11px;background:#dcfce7;color:#166534;padding:2px 8px;border-radius:10px;font-weight:700">勤${workDays}</span>`;
      if (restDays) html += `<span style="font-size:11px;background:#f3f4f6;color:#4b5563;padding:2px 8px;border-radius:10px;font-weight:600">休${restDays}</span>`;
      if (otDays) html += `<span style="font-size:11px;background:#ffedd5;color:#9a3412;padding:2px 8px;border-radius:10px;font-weight:700">加${otDays}</span>`;
      html += `</div>`;
      html += `</div>`;
    });

    // Daily headcount summary
    if (g.daily_headcount && g.daily_headcount.some(v => v && v.trim())) {
      html += `<div style="display:flex;align-items:center;gap:12px;padding:8px 0 12px;border-top:2px solid #f0f0f0;margin-top:4px">`;
      html += `<div style="min-width:110px;flex-shrink:0;font-size:12px;font-weight:600;color:${groupColor}">📊 每日出勤</div>`;
      html += `<div style="display:flex;gap:2px;flex:1;min-width:0">`;
      g.daily_headcount.forEach((val, di) => {
        const day = di + 1;
        const isToday = day === todayDay;
        let border = isToday ? '2px solid var(--orange)' : '1px solid #eee';
        html += `<div style="flex:1;min-width:14px;height:26px;background:${groupColor}10;border:${border};border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:${groupColor};overflow:hidden;white-space:nowrap">${val || ''}</div>`;
      });
      html += `</div><div style="min-width:90px"></div></div>`;
    }

    html += `</div></div>`;
  });

  document.getElementById('schedule-content').innerHTML = html;
  document.getElementById('loading').style.display = 'none';
}

// ============ Week View ============
function renderWeekView() {
  updateNavLabel();
  const groups = scheduleData.groups;
  const todayDay = scheduleData.today_day;
  const weekStart = getWeekStart(currentDay);
  const days = [];
  for (let d = weekStart; d <= Math.min(31, weekStart + 6); d++) days.push(d);
  let html = '';

  groups.forEach(g => {
    const visibleMembers = g.members.filter(m => shouldShowMember(m, g));
    if (visibleMembers.length === 0) return;
    const groupColor = visibleMembers[0].position_color || '#888';
    const groupTag = visibleMembers[0].position_tag || g.name;

    html += `<div class="card mb-16" style="overflow:hidden">`;
    html += `<div style="display:flex;align-items:center;gap:10px;padding:12px 20px;background:${groupColor}15;border-left:4px solid ${groupColor}">`;
    html += `<span style="font-size:16px;font-weight:700;color:${groupColor}">${g.name}</span>`;
    html += `<span style="font-size:12px;color:var(--text2);background:${groupColor}10;padding:2px 10px;border-radius:12px">${groupTag}</span>`;
    html += `<span style="font-size:12px;color:var(--text2)">${visibleMembers.length}人</span>`;
    html += `</div>`;

    // Day header
    html += `<div style="display:flex;align-items:center;padding:6px 20px;border-bottom:1px solid var(--border);background:#fafbfc">`;
    html += `<div style="min-width:120px;flex-shrink:0;font-size:11px;font-weight:600;color:var(--text2)">人员</div>`;
    html += `<div style="display:flex;flex:1;gap:4px;min-width:0">`;
    days.forEach(d => {
      const weekend = isWeekend(d);
      const isToday = d === todayDay;
      const bg = isToday ? '#fff3e0' : (weekend ? '#f0f0f0' : 'transparent');
      html += `<div style="flex:1;text-align:center;padding:4px;font-size:12px;font-weight:600;color:${weekend?'#999':'var(--text1)'};background:${bg};border-radius:4px;min-width:0;overflow:hidden;white-space:nowrap">${d}日 <span style="font-size:10px;color:#bbb">周${getWeekday(d)}</span></div>`;
    });
    html += `<div style="min-width:80px;text-align:center;font-size:11px;color:var(--text2);flex-shrink:0">出勤</div>`;
    html += `</div>`;

    // Member rows
    html += `<div style="padding:4px 20px">`;
    visibleMembers.forEach(m => {
      const color = m.position_color || groupColor;
      const tag = m.position_tag || g.name;
      const stats = m.stats || {};

      html += `<div class="sched-row" style="display:flex;align-items:center;padding:6px 0;border-bottom:1px solid #f5f5f5">`;
      html += `<div style="min-width:120px;flex-shrink:0;display:flex;align-items:center;gap:8px;min-width:0">`;
      html += avatarHtml(m.name, color, 28);
      html += `<div style="min-width:0;overflow:hidden">`;
      html += `<div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.name}</div>`;
      html += `<div style="font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${tag}</div>`;
      html += `</div></div>`;

      html += `<div style="display:flex;flex:1;gap:4px;min-width:0">`;
      days.forEach(d => {
        const val = m.days[d-1] || '';
        const t = getType(val);
        const tc = t ? TYPE_COLORS[t] : '';
        const isToday = d === todayDay;
        const weekend = isWeekend(d);
        let bg = tc || (weekend ? '#f3f4f6' : '#fff');
        let border = isToday ? '2px solid var(--orange)' : '1px solid #e5e7eb';
        let color = tc ? getContrastColor(tc) : (weekend ? '#6b7280' : '#374151');
        html += `<div style="flex:1;text-align:center;padding:6px 2px;background:${bg};border:${border};border-radius:4px;font-size:12px;font-weight:700;color:${color};min-height:28px;min-width:0;overflow:hidden;display:flex;align-items:center;justify-content:center;white-space:nowrap">${val}</div>`;
      });
      html += `</div>`;

      html += `<div style="min-width:80px;text-align:center;font-size:13px;font-weight:700;color:#2e7d32;flex-shrink:0">${stats['出勤天数'] || '--'}</div>`;
      html += `</div>`;
    });

    // Daily headcount
    if (g.daily_headcount && g.daily_headcount.some(v => v && v.trim())) {
      html += `<div style="display:flex;align-items:center;padding:6px 0;border-top:2px solid #f0f0f0;margin-top:4px">`;
      html += `<div style="min-width:120px;flex-shrink:0;font-size:12px;font-weight:600;color:${groupColor}">📊 出勤人数</div>`;
      html += `<div style="display:flex;flex:1;gap:4px;min-width:0">`;
      days.forEach(d => {
        const val = g.daily_headcount[d-1] || '';
        const isToday = d === todayDay;
        let border = isToday ? '2px solid var(--orange)' : '1px solid #eee';
        html += `<div style="flex:1;text-align:center;padding:6px 2px;background:${groupColor}10;border:${border};border-radius:4px;font-size:13px;font-weight:700;color:${groupColor};min-width:0;overflow:hidden;white-space:nowrap">${val}</div>`;
      });
      html += `</div><div style="min-width:80px"></div></div>`;
    }

    html += `</div></div>`;
  });

  document.getElementById('schedule-content').innerHTML = html;
  document.getElementById('loading').style.display = 'none';
}

// ============ Day View ============
function renderDayView() {
  updateNavLabel();
  const groups = scheduleData.groups;
  const todayDay = scheduleData.today_day;
  const day = currentDay;
  const isToday = day === todayDay;
  const weekend = isWeekend(day);
  let html = '';

  // Day summary banner
  let totalPresent = 0, totalRest = 0, totalLeave = 0, totalOT = 0;
  groups.forEach(g => {
    g.members.forEach(m => {
      if (!shouldShowMember(m, g)) return;
      const val = m.days[day - 1] || '';
      const type = getType(val);
      if (type === 'rest') totalRest++;
      else if (type === 'leave') totalLeave++;
      else if (type === 'overtime') totalOT++;
      else if (type.startsWith('work') || type === 'support') totalPresent++;
    });
  });

  html += `<div class="card mb-16" style="padding:16px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:${isToday ? '#fff8e1' : '#fff'};border-left:4px solid var(--accent)">`;
  html += `<div style="font-size:20px;font-weight:700;color:var(--text1)">8月${day}日 <span style="font-size:14px;color:var(--text2);font-weight:400">周${getWeekday(day)}${weekend?' (周末)':''}${isToday?' · 今天':''}</span></div>`;
  html += `<div style="display:flex;gap:16px;flex-wrap:wrap">`;
  html += `<span style="font-size:14px;background:#e8f5e9;color:#2e7d32;padding:4px 14px;border-radius:16px;font-weight:600">出勤 ${totalPresent}</span>`;
  html += `<span style="font-size:14px;background:#f5f5f5;color:#666;padding:4px 14px;border-radius:16px">休息 ${totalRest}</span>`;
  if (totalLeave > 0) html += `<span style="font-size:14px;background:#ffebee;color:#c62828;padding:4px 14px;border-radius:16px">请假 ${totalLeave}</span>`;
  if (totalOT > 0) html += `<span style="font-size:14px;background:#fff3e0;color:#e65100;padding:4px 14px;border-radius:16px">加班 ${totalOT}</span>`;
  html += `</div></div>`;

  // Group cards
  groups.forEach(g => {
    const visibleMembers = g.members.filter(m => shouldShowMember(m, g));
    if (visibleMembers.length === 0) return;
    const groupColor = visibleMembers[0].position_color || '#888';
    const groupTag = visibleMembers[0].position_tag || g.name;

    // Count for this group today
    let gPresent = 0, gRest = 0, gLeave = 0;
    visibleMembers.forEach(m => {
      const val = m.days[day - 1] || '';
      const type = getType(val);
      if (type === 'rest') gRest++;
      else if (type === 'leave') gLeave++;
      else if (type.startsWith('work') || type === 'overtime' || type === 'support') gPresent++;
    });

    html += `<div class="card mb-16" style="overflow:hidden">`;
    html += `<div style="display:flex;align-items:center;gap:10px;padding:12px 20px;background:${groupColor}15;border-left:4px solid ${groupColor}">`;
    html += `<span style="font-size:16px;font-weight:700;color:${groupColor}">${g.name}</span>`;
    html += `<span style="font-size:12px;color:var(--text2);background:${groupColor}10;padding:2px 10px;border-radius:12px">${groupTag}</span>`;
    html += `<span style="font-size:12px;color:var(--text2)">${visibleMembers.length}人</span>`;
    html += `<span style="margin-left:auto;font-size:12px;color:#666">出勤${gPresent} · 休息${gRest}${gLeave?` · 请假${gLeave}`:''}</span>`;
    html += `</div>`;

    // Member grid
    html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;padding:12px 20px">`;
    visibleMembers.forEach(m => {
      const color = m.position_color || groupColor;
      const tag = m.position_tag || g.name;
      const val = m.days[day - 1] || '';
      const type = getType(val);
      const tc = getTypeColor(val);
      const tLabel = getTypeLabel(val);

      // Status styling（高对比）
      let statusBg = tc || '#f3f4f6';
      let statusColor = tc ? getContrastColor(tc) : '#6b7280';

      html += `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border:1px solid #f0f0f0;border-radius:10px;transition:all .15s" onmouseover="this.style.borderColor='${color}'" onmouseout="this.style.borderColor='#f0f0f0'">`;
      html += avatarHtml(m.name, color, 36);
      html += `<div style="flex:1;min-width:0">`;
      html += `<div style="font-size:13px;font-weight:600;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.name}</div>`;
      html += `<div style="font-size:10px;color:var(--text2)">${m.id || '--'} · ${tag}</div>`;
      html += `</div>`;
      // Status badge
      if (val) {
        html += `<span style="padding:3px 10px;border-radius:6px;background:${statusBg};font-size:12px;font-weight:600;color:${statusColor};white-space:nowrap">${val}</span>`;
      } else {
        html += `<span style="padding:3px 10px;border-radius:6px;background:#f5f5f5;font-size:12px;color:#ccc">--</span>`;
      }
      html += `</div>`;
    });
    html += `</div></div>`;
  });

  document.getElementById('schedule-content').innerHTML = html;
  document.getElementById('loading').style.display = 'none';
}

// ============ Main ============
function renderContent() {
  if (!scheduleData) return;
  if (viewMode === 'month') renderMonthView();
  else if (viewMode === 'week') renderWeekView();
  else if (viewMode === 'day') renderDayView();
}

async function loadSchedule() {
  try {
    const resp = await fetch('/api/schedule');
    const json = await resp.json();
    if (json.ok) {
      scheduleData = json.data;
      currentDay = scheduleData.today_day || 1;
      renderKPI(scheduleData);
      renderPositionFilters();
      renderContent();
    } else {
      document.getElementById('loading').innerHTML = `<p style="color:var(--red)">加载失败: ${json.error || '未知错误'}</p>`;
    }
  } catch (e) {
    document.getElementById('loading').innerHTML = `<p style="color:var(--red)">加载失败: ${e.message}</p>`;
  }
}

async function refreshSchedule() {
  const btn = document.getElementById('btn-refresh');
  btn.textContent = '刷新中...';
  btn.disabled = true;
  btn.style.opacity = '0.6';
  try {
    const resp = await fetch('/api/schedule/refresh', {method: 'POST'});
    const json = await resp.json();
    if (json.ok) {
      scheduleData = json.data;
      renderKPI(scheduleData);
      renderPositionFilters();
      renderContent();
      btn.textContent = '刷新成功';
      setTimeout(() => { btn.textContent = '刷新数据'; }, 2000);
    } else {
      alert('刷新失败: ' + (json.error || '未知错误'));
      btn.textContent = '刷新数据';
    }
  } catch (e) {
    alert('刷新失败: ' + e.message);
    btn.textContent = '刷新数据';
  }
  btn.disabled = false;
  btn.style.opacity = '1';
}

loadSchedule();
</script>
